  postgres15:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_IMAGE_TAG: ${POSTGRES15_IMAGE_TAG:-15-alpine}
    # container_name: ${POSTGRES15_CONTAINER_NAME:-db_postgres15}
    image: dev-env-postgres
    container_name: dev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES15_DB}
      POSTGRES_USER: ${POSTGRES15_USER}
      POSTGRES_PASSWORD: ${POSTGRES15_PASSWORD}
      PGDATA: ${POSTGRES15_DATA_DIR:-/var/lib/postgresql/data/pgdata}
      # TZ: ${TZ}    

  #   environment:
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #     - POSTGRES_USER=${POSTGRES_USER}
  #     - POSTGRES_DB=${POSTGRES_DB}
  #     - TZ=${TZ}      
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "${POSTGRES15_HOST_PORT:-5432}:5432"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/postgres15:/var/lib/postgresql/data
      - ${PROJECTS_ROOT}/docker-env/logs/postgres15:${POSTGRES15_LOG_DIR:-/var/log/postgresql}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev_user} -d $${POSTGRES_DB:-app_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dev-net      
networks:
  dev-net:
    driver: bridge
