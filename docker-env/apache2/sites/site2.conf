# site2.test — Apache secondary web server
# PHP: routes to php-fpm74 (PHP 7.4)

<VirtualHost *:8080>
    ServerName site2.test
    DocumentRoot /var/www/html/site2

    <Directory /var/www/html/site2>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-fpm74:9000"
    </FilesMatch>

    ErrorLog  /var/log/apache2/site2.error.log
    CustomLog /var/log/apache2/site2.access.log combined
</VirtualHost>

<VirtualHost *:8443>
    ServerName site2.test
    DocumentRoot /var/www/html/site2

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/dev.test.crt
    SSLCertificateKeyFile /etc/apache2/certs/dev.test.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    <Directory /var/www/html/site2>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-fpm74:9000"
    </FilesMatch>

    ErrorLog  /var/log/apache2/site2.error.log
    CustomLog /var/log/apache2/site2.access.log combined
</VirtualHost>
