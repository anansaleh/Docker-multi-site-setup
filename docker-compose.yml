services:
  nginx:
    build:
      context: ./nginx
    container_name: dev-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/ssl_files:/etc/nginx/certs:ro
      - ${PROJECTS_ROOT}/docker-env/logs/nginx:/var/log/nginx
    environment:
      - TZ=${TZ}
    depends_on:
      - php-fpm84
      - php-fpm74
    networks:
      - dev-net

  apache2:
    build:
      context: ./apache2
    container_name: dev-apache2
    restart: unless-stopped
    ports:
      - "${APACHE_HTTP_PORT}:8080"
      - "${APACHE_HTTPS_PORT}:8443"
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/ssl_files:/etc/apache2/certs:ro
      - ${PROJECTS_ROOT}/docker-env/logs/apache2:/var/log/apache2
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  php-fpm84:
    build:
      context: ./php-fpm84
    image: dev-env-php-fpm84
    container_name: dev-php-fpm84
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/logs/php-fpm84:/var/log/php
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  php-fpm74:
    build:
      context: ./php-fpm74
    image: dev-env-php-fpm74
    container_name: dev-php-fpm74
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/logs/php-fpm74:/var/log/php
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION}
    image: dev-env-mysql
    container_name: dev-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/mysql80:/var/lib/mysql
      - ${PROJECTS_ROOT}/docker-env/logs/mysql:/var/log/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

  mariadb:
    build:
      context: ./mariadb
      args:
        MARIADB_VERSION: ${MARIADB_VERSION}
    image: dev-env-mariadb
    container_name: dev-mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/mariadb11:/var/lib/mysql
      - ${PROJECTS_ROOT}/docker-env/logs/mariadb:/var/log/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

