services:
  nginx:
    build:
      context: ./nginx
    container_name: dev-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/ssl_files:/etc/nginx/certs:ro
      - ${PROJECTS_ROOT}/docker-env/logs/nginx:/var/log/nginx
    environment:
      - TZ=${TZ}
    depends_on:
      - php-fpm84
      - php-fpm74
    networks:
      - dev-net

  apache2:
    build:
      context: ./apache2
    container_name: dev-apache2
    restart: unless-stopped
    ports:
      - "${APACHE_HTTP_PORT}:8080"
      - "${APACHE_HTTPS_PORT}:8443"
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/ssl_files:/etc/apache2/certs:ro
      - ${PROJECTS_ROOT}/docker-env/logs/apache2:/var/log/apache2
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  php-fpm84:
    build:
      context: ./php-fpm84
    image: dev-env-php-fpm84
    container_name: dev-php-fpm84
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/logs/php-fpm84:/var/log/php
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  php-fpm74:
    build:
      context: ./php-fpm74
    image: dev-env-php-fpm74
    container_name: dev-php-fpm74
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/docker-env/logs/php-fpm74:/var/log/php
    environment:
      - TZ=${TZ}
    networks:
      - dev-net

  mysql:
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION}
    image: dev-env-mysql
    container_name: dev-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/mysql80:/var/lib/mysql
      - ${PROJECTS_ROOT}/docker-env/logs/mysql:/var/log/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=${TZ}
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

  mariadb:
    build:
      context: ./mariadb
      args:
        MARIADB_VERSION: ${MARIADB_VERSION}
    image: dev-env-mariadb
    container_name: dev-mariadb
    restart: unless-stopped
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/mariadb11:/var/lib/mysql
      - ${PROJECTS_ROOT}/docker-env/logs/mariadb:/var/log/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        POSTGRES_IMAGE_TAG: ${POSTGRES15_IMAGE_TAG:-15-alpine}
    container_name: ${POSTGRES15_CONTAINER_NAME:-db_postgres15}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES15_DB}
      POSTGRES_USER: ${POSTGRES15_USER}
      POSTGRES_PASSWORD: ${POSTGRES15_PASSWORD}
      PGDATA: ${POSTGRES15_DATA_DIR:-/var/lib/postgresql/data/pgdata}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "${POSTGRES15_HOST_PORT:-5432}:5432"
    volumes:
      - ./data_files/postgres15:/var/lib/postgresql/data
      - ./logs/postgres15:${POSTGRES15_LOG_DIR:-/var/log/postgresql}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dev_user} -d $${POSTGRES_DB:-app_local}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dev-net   

  mongodb:
    build:
      context: ./mongodb
      args:
        MONGODB_VERSION: ${MONGODB_VERSION}
    image: dev-env-mongodb
    container_name: dev-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT}:27017"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/mongodb8:/data/db
      - ${PROJECTS_ROOT}/docker-env/logs/mongodb:/var/log/mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
      - TZ=${TZ}
    command: ["mongod", "--config", "/etc/mongo/mongod.conf", "--auth"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

  couchdb:
    build:
      context: ./couchdb
      args:
        COUCHDB_VERSION: ${COUCHDB_VERSION}
    image: dev-env-couchdb
    container_name: dev-couchdb
    restart: unless-stopped
    ports:
      - "${COUCHDB_PORT}:5984"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/couchdb34:/opt/couchdb/data
      - ${PROJECTS_ROOT}/docker-env/logs/couchdb:/var/log/couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dev-net

  redis:
    build:
      context: ./redis
      args:
        REDIS_VERSION: ${REDIS_VERSION}
    image: dev-env-redis
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/redis:/data
      - ${PROJECTS_ROOT}/docker-env/logs/redis:/var/log/redis
    environment:
      - TZ=${TZ}
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dev-net


  workspace84:
    build:
      context: ./workspace84
    image: dev-env-workspace84
    container_name: dev-workspace84
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/backup_data:/backup
    environment:
      - TZ=${TZ}
    command: ["tail", "-f", "/dev/null"]
    networks:
      - dev-net

  workspace74:
    build:
      context: ./workspace74
    image: dev-env-workspace74
    container_name: dev-workspace74
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/backup_data:/backup
    environment:
      - TZ=${TZ}
    command: ["tail", "-f", "/dev/null"]
    networks:
      - dev-net

  phpmyadmin:
    build:
      context: ./phpmyadmin
    image: dev-env-phpmyadmin
    container_name: dev-phpmyadmin
    restart: unless-stopped
    profiles:
      - phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      - PMA_ARBITRARY=1
      # - PMA_HOST=mysql
      # - PMA_USER=root
      # - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - UPLOAD_LIMIT=128M
      - TZ=${TZ}
    depends_on:
      - mysql
    networks:
      - dev-net

  pgadmin:
    build:
      context: ./pgadmin
    image: dev-env-pgadmin
    container_name: dev-pgadmin
    restart: unless-stopped
    profiles:
      - pgadmin
    ports:
      - "${PGADMIN_PORT}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - TZ=${TZ}
    volumes:
      - ${PROJECTS_ROOT}/docker-env/data_files/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dev-net

  mongo-express:
    build:
      context: ./mongo-express
    image: dev-env-mongo-express
    container_name: dev-mongo-express
    restart: unless-stopped
    profiles:
      - mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGODB_ROOT_USERNAME}:${MONGODB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGODB_ROOT_USERNAME}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGODB_ROOT_PASSWORD}
      - TZ=${TZ}
    depends_on:
      - mongodb
    networks:
      - dev-net

  adminer:
    build:
      context: ./adminer
    image: dev-env-adminer
    container_name: dev-adminer
    restart: unless-stopped
    profiles:
      - adminer
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
      - TZ=${TZ}
    depends_on:
      - mysql
      - mariadb
      - postgres
      - mongodb
    networks:
      - dev-net

  php-worker84:
    build:
      context: ./php-worker84
    image: dev-env-php-worker84
    container_name: dev-php-worker84
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/backup_data:/backup
    environment:
      - TZ=${TZ}
    depends_on:
      - redis
      - mysql
      - mariadb
      - postgres
    networks:
      - dev-net

  php-worker74:
    build:
      context: ./php-worker74
    image: dev-env-php-worker74
    container_name: dev-php-worker74
    restart: unless-stopped
    volumes:
      - ${PROJECTS_ROOT}/sites/site1:/var/www/html/site1
      - ${PROJECTS_ROOT}/sites/site2:/var/www/html/site2
      - ${PROJECTS_ROOT}/default-host/v3client:/var/www/html/v3client
      - ${PROJECTS_ROOT}/default-host/client_data:/home/client_data
      - ${PROJECTS_ROOT}/default-host/server_side:/home/server_side
      - ${PROJECTS_ROOT}/backup_data:/backup
    environment:
      - TZ=${TZ}
    depends_on:
      - redis
      - mysql
      - mariadb
      - postgres
    networks:
      - dev-net
      
networks:
  dev-net:
    driver: bridge
