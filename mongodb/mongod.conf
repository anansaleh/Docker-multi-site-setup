# ============================================================
# MongoDB 8 custom configuration
# Local development environment
# ============================================================

storage:
  dbPath: /data/db

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: rename

net:
  port: 27017
  bindIp: 0.0.0.0

operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 2000

security:
  authorization: enabled
