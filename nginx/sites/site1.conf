# site1.test

server {
    listen 80;
    listen [::]:80;
    server_name site1.test;

    root /var/www/html/site1;
    index index.html index.php;

    access_log /var/log/nginx/site1.access.log main;
    error_log  /var/log/nginx/site1.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm84:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name site1.test;

    # ssl_certificate     /etc/nginx/certs/dev.test.crt;
    # ssl_certificate_key /etc/nginx/certs/dev.test.key;
    ssl_certificate     /etc/nginx/certs/wildcard.test.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.test.key;    
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /var/www/html/site1;
    index index.html index.php;

    access_log /var/log/nginx/site1.access.log main;
    error_log  /var/log/nginx/site1.error.log warn;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm84:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
