# site1.test — Apache secondary web server

<VirtualHost *:8080>
    ServerName site1.test
    DocumentRoot /var/www/html/site1

    <Directory /var/www/html/site1>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /var/log/apache2/site1.error.log
    CustomLog /var/log/apache2/site1.access.log combined
</VirtualHost>

<VirtualHost *:8443>
    ServerName site1.test
    DocumentRoot /var/www/html/site1

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/wildcard.test.crt
    SSLCertificateKeyFile /etc/apache2/certs/wildcard.test.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    <Directory /var/www/html/site1>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /var/log/apache2/site1.error.log
    CustomLog /var/log/apache2/site1.access.log combined
</VirtualHost>
