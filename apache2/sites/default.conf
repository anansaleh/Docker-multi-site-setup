# Default catch-all vhost for Apache
# Matches: dev.test, localhost, 127.0.0.1 on ports 8080/8443

<VirtualHost *:8080>
    ServerName dev.test
    ServerAlias localhost 127.0.0.1
    DocumentRoot /var/www/html/v3client

    <Directory /var/www/html/v3client>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /var/log/apache2/default.error.log
    CustomLog /var/log/apache2/default.access.log combined
</VirtualHost>

<VirtualHost *:8443>
    ServerName dev.test
    ServerAlias localhost 127.0.0.1
    DocumentRoot /var/www/html/v3client

    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/wildcard.test.crt
    SSLCertificateKeyFile /etc/apache2/certs/wildcard.test.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5

    <Directory /var/www/html/v3client>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /var/log/apache2/default.error.log
    CustomLog /var/log/apache2/default.access.log combined
</VirtualHost>
